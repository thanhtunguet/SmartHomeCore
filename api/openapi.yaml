openapi: 3.0.3
info:
  title: HomeCore API
  version: 0.1.0
  description: |
    REST API of the HomeCore Controller.

    * All `/api/v1` endpoints require a Bearer JWT unless marked otherwise.
    * There are no roles: every authenticated user may call every operation (ADR-011).
    * The three `legacy` operations (`/api/turn-on`, `/api/turn-off`, `/api/is-online`) are for apps
      that predate multi-device support. They take the device in a `device` query parameter and also
      accept the long-lived, legacy-scoped tokens of `homecore token create`; such a token is refused
      (`403`) on every other operation (ADR-017).
    * **Service account keys** (ADR-018) are long-lived, revocable credentials for the legacy endpoints
      and for AI agents. A user creates one with `POST /service-account-keys` (session
      token required); the response carries the key once, to be sent as `Authorization: Bearer <key>`.
      A key has a **scope**: `legacy` (the three legacy operations) or `mcp` (device control and
      read-only monitoring). Operations list the scopes they accept in `x-token-scopes`; a scoped
      key is refused (`403`) everywhere else, and key management is never open to a key. A key
      replaces itself with `POST /auth/service-key/rotate`.
    * **MCP server** (ADR-020): `POST /api/v1/mcp` lets an AI agent list devices, read one and turn it
      on or off. It accepts any valid service account key, whatever its scope.
    * Wake/shutdown return `202 Accepted` with a command; poll `GET /api/v1/commands/{id}` for the outcome.
    * Wake/shutdown are **idempotent** and **fail fast**: repeating one has the effect of sending it
      once and is never an error (see each operation). At most **one wake/shutdown request per device
      per second**, counted across all users; more answer `429 rate_limited` with `Retry-After: 1`.

    Conventions:

    * **Errors** always use the envelope `{"error":{"code","message"}}`, including `501 not_implemented`
      for operations the Controller has not implemented yet.
    * **Lists** are cursor-paginated (`limit`, `cursor`, `next_cursor`); there is no total count.
      Order is fixed per endpoint: devices by `name` (case-insensitive, ascending), commands newest
      first, status history newest first, activity newest first.
    * **Clearing optional text fields** on `PATCH /devices/{id}`: send an empty string (`""`) for
      `description`, `hostname`, `mac_address` or `wol_broadcast_address`. Omitted fields are unchanged.
      `null` is not used. To remove the agent binding call `DELETE /devices/{id}/agent`.
    * **Optional response fields** may be absent when the Controller cannot supply them (for example
      metrics a platform does not expose); clients must treat absence as "unknown".
  license:
    name: Proprietary
servers:
  - url: /
security:
  - bearerAuth: []

tags:
  - name: health
  - name: auth
  - name: devices
  - name: commands
  - name: system
  - name: activity
  - name: ddns
  - name: alerts
    description: Alert channels (Telegram, more later) that tell the owner about IP changes, power commands and unexpected device status changes.
  - name: port-forwards
    description: TCP/UDP port forwarding rules run by the Controller (ADR-022).
  - name: service-keys
    description: Service account keys for legacy clients and AI agents (ADR-018).
  - name: legacy
    description: Three GET endpoints for apps written before multi-device support (ADR-017).
  - name: mcp
    description: MCP server for AI agents, authenticated with a service account key (ADR-020).

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: Readiness probe (database reachable, migrations applied)
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange username/password for tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Rotate a refresh token and get a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke a refresh token family
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      x-token-scopes: [mcp]
      summary: Current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/auth/service-key/rotate:
    post:
      tags: [auth, service-keys]
      operationId: rotateServiceAccountKey
      x-token-scopes: [legacy, mcp]
      summary: Rotate the service account key used for this request
      description: |
        Authenticate with the service account key to replace (`Authorization: Bearer <key>`). The
        Controller checks that the key is valid (not revoked, not expired), creates a new key of the
        same owner, name and scope with a new key pair, and answers with it. A session token is
        refused (`403`): only a key can rotate itself; users manage keys with the
        `/service-account-keys` operations.

        The old key is **not** cut off at once: it keeps working for `previous_key_valid_until`
        (a minute) so a client that lost this response can retry. A retry with the old key inside
        that window returns the same new key (`200`, no second key is created); after it the old key
        is `401`. The new key's lifetime is the old key's `ttl_seconds` unless the request sets one.
        Store the new key before using it: it is shown only in this response and at creation.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotateServiceAccountKeyRequest" }
      responses:
        "200":
          description: The new key
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccountKeyCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            The key was already rotated and its successor is no longer usable (revoked or expired);
            create a new key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/service-account-keys:
    get:
      tags: [service-keys]
      operationId: listServiceAccountKeys
      summary: List the caller's service account keys
      description: |
        Metadata only, newest first: the key material is never returned again. Keys of other users
        are not listed. Session token required.
      responses:
        "200":
          description: The caller's keys
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceAccountKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [service-keys]
      operationId: createServiceAccountKey
      summary: Create a service account key
      description: |
        The Controller generates an Ed25519 key pair, keeps the private key sealed in its database
        and returns the key once in `key`. Send it as `Authorization: Bearer <key>`. Actions made
        with it are attributed to the caller. `ttl_seconds` defaults to one year (at most 20 years).
        Session token required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateServiceAccountKeyRequest" }
      responses:
        "201":
          description: The new key; `key` is shown only here
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccountKeyCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/service-account-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/ServiceAccountKeyId"
    delete:
      tags: [service-keys]
      operationId: revokeServiceAccountKey
      summary: Revoke a service account key
      description: |
        Takes effect at once. Idempotent: revoking a revoked key is `204`. A key that does not exist or
        belongs to another user is `404`. Session token required.
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      x-token-scopes: [mcp]
      summary: List devices
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [devices]
      operationId: createDevice
      summary: Register a device
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      tags: [devices]
      operationId: getDevice
      x-token-scopes: [mcp]
      summary: Get a device
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [devices]
      operationId: updateDevice
      summary: Update a device (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [devices]
      operationId: deleteDevice
      summary: Delete a device
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/devices/{id}/agent:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    delete:
      tags: [devices]
      operationId: removeDeviceAgent
      summary: Remove the agent binding (remote shutdown no longer possible)
      description: Idempotent for a device that exists but has no binding (`204`).
      responses:
        "204": { description: Binding removed (or none existed) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/devices/{id}/wake:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    post:
      tags: [devices, commands]
      operationId: wakeDevice
      x-token-scopes: [mcp]
      summary: Send Wake-on-LAN (asynchronous, idempotent)
      description: |
        Returns a `wake` command (`202`). Idempotent: if a wake command is already active for this
        device that command is returned, and if the device is already `online` the command completes
        immediately without sending a packet. Neither case is an error. A command of the other type
        (shutdown) is independent and does not affect this one.

        The command is `pending`, then `sent` once the magic packet left (a send failure is reported
        at once as `failed`); there is no `acknowledged` step. It becomes `completed` when the
        monitor sees the device online before `deadline_at` (default 180 s) and `timed_out`
        otherwise.

        `409 Conflict` only when the request cannot work at all: the device has no `mac_address`.
        `429` when this device already received a wake/shutdown request less than 1 s ago.
      responses:
        "202":
          description: Wake command accepted (not the same as "device powered on")
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/devices/{id}/shutdown:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    post:
      tags: [devices, commands]
      operationId: shutdownDevice
      x-token-scopes: [mcp]
      summary: Request a signed shutdown via the device's agent (asynchronous, idempotent)
      description: |
        Returns a `shutdown` command (`202`). Idempotent: if a shutdown command is already active for
        this device that command is returned, and if the device is already `offline` the command
        completes immediately without contacting the agent. Neither case is an error. A command of
        the other type (wake) is independent and does not affect this one.

        Lifecycle: `pending` → `sent` (request signed and delivered) → `acknowledged` (the agent
        accepted it) → `completed` (the monitor saw the device go offline before `deadline_at`,
        default 120 s). `failed` when dispatch fails or the agent rejects the command (see
        `error_code` on `Command`); dispatch is one short attempt, so an unreachable agent fails
        within seconds. `timed_out` when the deadline passes first.

        `409 Conflict` only when the request cannot work at all: the device has no agent binding.
        `429` when this device already received a wake/shutdown request less than 1 s ago.
        Audited in `audit_log`.
      responses:
        "202":
          description: Shutdown command accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/devices/{id}/probe:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    post:
      tags: [devices]
      operationId: probeDevice
      x-token-scopes: [mcp]
      summary: Run a TCP probe now
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/devices/{id}/history:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      tags: [devices]
      operationId: getDeviceHistory
      x-token-scopes: [mcp]
      summary: Status transitions of a device
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: History
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusHistory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/commands:
    get:
      tags: [commands]
      operationId: listCommands
      x-token-scopes: [mcp]
      summary: Command history
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: device_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CommandStatus" }
      responses:
        "200":
          description: Commands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/commands/{id}:
    get:
      tags: [commands]
      operationId: getCommand
      x-token-scopes: [mcp]
      summary: Get a command
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Command
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/system/metrics:
    get:
      tags: [system]
      operationId: getSystemMetrics
      x-token-scopes: [mcp]
      summary: Metrics of the host running the Controller
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemMetrics" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/system/info:
    get:
      tags: [system]
      operationId: getSystemInfo
      x-token-scopes: [mcp]
      summary: Read-only Controller information and effective defaults
      description: Never contains secrets, keys or file paths.
      responses:
        "200":
          description: Controller information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/system/settings/openapi:
    get:
      tags: [system]
      operationId: getOpenAPISettings
      summary: Read whether the OpenAPI document and Swagger UI are enabled
      responses:
        "200":
          description: OpenAPI setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenAPISettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [system]
      operationId: updateOpenAPISettings
      summary: Enable or disable the OpenAPI document and Swagger UI
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenAPISettings" }
      responses:
        "200":
          description: Updated OpenAPI setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenAPISettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/system/controller-key:
    get:
      tags: [system]
      operationId: getControllerKey
      summary: Public signing key to paste into an agent's trusted_controllers
      description: |
        The active Ed25519 key the Controller signs agent commands with. Only the public part is ever
        returned. `key_id` is the lower-case hex of the first 8 bytes of SHA-256(public key), the same
        value an agent logs when it trusts the key. The key is generated on the Controller's first start.
        The same values are printed by `homecore key show`.
      responses:
        "200":
          description: Active controller public key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControllerKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/activity:
    get:
      tags: [activity]
      operationId: listActivity
      x-token-scopes: [mcp]
      summary: Activity feed (who did what), newest first
      description: |
        Read-only feed built from the Controller's audit log: sign-ins, device changes, wake and
        shutdown requests, account changes. Any authenticated user may read it (ADR-011).

        Command *outcomes* (`completed`, `timed_out`) are not entries here: an entry of category
        `command` carries the `command_id`, and `GET /commands/{id}` gives its lifecycle.
        Client addresses and the reasons of failed sign-ins are not exposed. Cursor-paginated like
        the other lists; entries are never pruned by `retention_days`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: device_id
          in: query
          description: Only entries about this device.
          schema: { type: string, format: uuid }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/ActivityCategory" }
      responses:
        "200":
          description: Activity entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/ddns:
    get:
      tags: [ddns]
      operationId: listDdnsConfigs
      summary: List DDNS configurations
      responses:
        "200":
          description: DDNS configs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DdnsConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ddns]
      operationId: createDdnsConfig
      summary: Add a DDNS configuration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DdnsConfigCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DdnsConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/ddns/cloudflare/zones:
    post:
      tags: [ddns]
      operationId: listCloudflareZones
      summary: List the Cloudflare zones a token can see
      description: |
        Feeds the zone dropdown of the DDNS form, which is the only way to pick a zone: a token that
        may edit DNS can also read it, so nothing is typed by hand. It is a `POST` only so that the
        token travels in the body (never in a URL or an access log); it changes nothing. The token
        is not stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudflareLookup" }
      responses:
        "200":
          description: Zones
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudflareZoneList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/ddns/cloudflare/zones/{zone_id}/records:
    parameters:
      - name: zone_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      tags: [ddns]
      operationId: listCloudflareRecords
      summary: List the A/AAAA records of a Cloudflare zone
      description: |
        Feeds the record dropdown of the DDNS form (same body and reasons as `listCloudflareZones`).
        `404` when `config_id` is unknown.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudflareLookup" }
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudflareRecordList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/ddns/{id}:
    parameters:
      - $ref: "#/components/parameters/DdnsId"
    patch:
      tags: [ddns]
      operationId: updateDdnsConfig
      summary: Update a DDNS configuration (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DdnsConfigUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DdnsConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [ddns]
      operationId: deleteDdnsConfig
      summary: Delete a DDNS configuration
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/ddns/{id}/sync:
    parameters:
      - $ref: "#/components/parameters/DdnsId"
    post:
      tags: [ddns]
      operationId: syncDdnsConfig
      summary: Synchronise one DDNS record now
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DdnsSyncResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/alerts/channels:
    get:
      tags: [alerts]
      operationId: listAlertChannels
      summary: List alert channels
      responses:
        "200":
          description: Alert channels, ordered by name
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AlertChannel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [alerts]
      operationId: createAlertChannel
      summary: Add an alert channel
      description: |
        A channel is one destination for alerts, served by an adapter (`type`). Every adapter takes
        non-secret `settings` (string values) and one `secret`, which is sealed at rest and never
        returned. `telegram`: `settings.target_user_id` is the numeric Telegram user (or group) id
        that receives the messages, `secret` is the bot token from BotFather. The target must have
        started a chat with the bot first, or Telegram refuses to deliver.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertChannelCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/alerts/channels/{id}:
    parameters:
      - $ref: "#/components/parameters/AlertChannelId"
    get:
      tags: [alerts]
      operationId: getAlertChannel
      summary: Get one alert channel
      responses:
        "200":
          description: The channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertChannel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [alerts]
      operationId: updateAlertChannel
      summary: Update an alert channel (partial)
      description: |
        `type` cannot change. `settings`, when present, replaces all settings of the channel;
        `events`, when present, replaces the subscription. The `secret` is changed only when given.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertChannelUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [alerts]
      operationId: deleteAlertChannel
      summary: Delete an alert channel
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/alerts/channels/{id}/test:
    parameters:
      - $ref: "#/components/parameters/AlertChannelId"
    post:
      tags: [alerts]
      operationId: testAlertChannel
      summary: Send a test message through a channel now
      description: |
        Works on a disabled channel too. A delivery that fails is a `200` with `result: failed` and
        the reason in `error`, because the request itself worked (as for `syncDdnsConfig`).
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertTestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/port-forwards:
    get:
      tags: [port-forwards]
      operationId: listPortForwards
      summary: List port forwarding rules
      responses:
        "200":
          description: Rules, ordered by name (case-insensitive)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PortForward" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [port-forwards]
      operationId: createPortForward
      summary: Add a port forwarding rule
      description: |
        The Controller listens on `listen_address:listen_port` and relays every TCP connection
        and/or UDP datagram to `target_host:target_port` (ADR-022). `protocol` is `tcp`, `udp` or
        `universal` (both, on the same port). An enabled rule starts at once; the `201` carries the
        outcome in `status` (`running`, or `error` with the reason in `last_error`, for example the
        port is already in use). A rule that cannot start stays `enabled` and is retried
        periodically, so it also comes up after a restart once the port or interface is available.

        `listen_address` is an IP literal (default `0.0.0.0`: every IPv4 interface). It is not checked
        against the host's interfaces when the rule is saved: an address that is not available makes
        the rule `error` until it is. Two **enabled** rules cannot overlap on the same port, protocol
        and address (`409`); a disabled rule reserves nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortForwardCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortForward" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/port-forwards/{id}:
    parameters:
      - $ref: "#/components/parameters/PortForwardId"
    get:
      tags: [port-forwards]
      operationId: getPortForward
      summary: Get one port forwarding rule
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortForward" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [port-forwards]
      operationId: updatePortForward
      summary: Update a port forwarding rule (partial)
      description: |
        `enabled` is the on/off switch: `false` closes the listeners (established connections are
        dropped), `true` opens them. The state is stored, so the Controller restores it after a
        restart. A change of any other field restarts a running rule. Omitted fields are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortForwardUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortForward" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [port-forwards]
      operationId: deletePortForward
      summary: Delete a port forwarding rule
      description: Closes the listeners first, then removes the rule.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/turn-on:
    get:
      tags: [legacy, devices]
      operationId: legacyTurnOn
      x-token-scopes: [legacy, mcp]
      summary: "Legacy: turn the device on (Wake-on-LAN)"
      description: |
        For old apps. Same as `POST /api/v1/devices/{id}/wake`, addressed by the `device` query
        parameter, and answered with the plain text `true` once the request is accepted (`200`).
        It does not wait for the machine to come up; poll `/api/is-online`.

        `device` is the device id (UUID) or its name (case-insensitive). Authentication is the normal
        `Authorization: Bearer` header; besides a session token, the long-lived tokens made by
        `homecore token create` are accepted here. Errors use the usual JSON envelope: `404` unknown
        device, `409` no MAC address, `429` more than one wake/shutdown per device per second.
      parameters:
        - $ref: "#/components/parameters/LegacyDevice"
      responses:
        "200": { $ref: "#/components/responses/LegacyTrue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/turn-off:
    get:
      tags: [legacy, devices]
      operationId: legacyTurnOff
      x-token-scopes: [legacy, mcp]
      summary: "Legacy: turn the device off (signed shutdown via its agent)"
      description: |
        For old apps. Same as `POST /api/v1/devices/{id}/shutdown`, addressed by the `device` query
        parameter, and answered with the plain text `true` once the request is accepted (`200`).
        It does not wait for the machine to go down; poll `/api/is-online`. The shutdown is audited
        with the owner of the token. `409` when the device has no agent binding.

        A `GET` that changes state is not safe to prefetch or cache: keep the token secret and do not
        open this URL in a browser by accident.
      parameters:
        - $ref: "#/components/parameters/LegacyDevice"
      responses:
        "200": { $ref: "#/components/responses/LegacyTrue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/is-online:
    get:
      tags: [legacy, devices]
      operationId: legacyIsOnline
      x-token-scopes: [legacy, mcp]
      summary: "Legacy: is the device online? (plain text true or false)"
      description: |
        For old apps. Answers `200` with the plain text `true` when the Controller last observed the
        device `online`, `false` otherwise (`offline` or `unknown`). Reads the stored status; it does
        not probe. An unknown device is `404`, not `false`.
      parameters:
        - $ref: "#/components/parameters/LegacyDevice"
      responses:
        "200":
          description: The text `true` or `false`
          content:
            text/plain:
              schema: { type: string, enum: ["true", "false"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/mcp:
    post:
      tags: [mcp]
      operationId: callMcp
      x-token-scopes: [legacy, mcp]
      summary: MCP server for AI agents (Streamable HTTP, JSON-RPC 2.0)
      description: |
        The Controller's Model Context Protocol endpoint (ADR-020). An MCP client connects to this URL
        and authenticates with a **service account key** (`Authorization: Bearer <key>`); a session
        token is refused with `403`. Any valid key is accepted whatever its scope: there is no
        per-tool permission.

        The transport is stateless Streamable HTTP without server-sent events: each `POST` carries one
        JSON-RPC 2.0 message (batches are not supported) and, for a request, is answered with
        `application/json`. Notifications and client responses are answered `202` with no body.
        `GET` and `DELETE` are `405`.

        Methods: `initialize`, `ping`, `tools/list`, `tools/call`. Tools:

        * `list_devices`: every device with its current status.
        * `get_devices`: one device, by id or name.
        * `control_device`: `action` is `turn_on` (Wake-on-LAN), `turn_off` (signed shutdown through the
          device's agent) or `check_status` (probe now). Same rules as the REST operations: idempotent,
          asynchronous, at most one power request per device per second, audited with the key's
          owner and key id.

        Errors in a tool call (unknown device, device cannot be powered, throttled) are returned as a
        tool result with `isError: true`, so the agent can read them; protocol errors are JSON-RPC
        errors. Request and response bodies are defined by the MCP specification, not by this
        document.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The JSON-RPC response to a request (a result or an error object).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "202":
          description: A notification or a client response was accepted; there is no body.
        "400":
          description: The body is not valid JSON or not a single JSON-RPC message. The body is a JSON-RPC error object.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DeviceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceAccountKeyId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DdnsId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AlertChannelId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PortForwardId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LegacyDevice:
      name: device
      in: query
      required: true
      description: The device's id (UUID) or its name, compared case-insensitively.
      schema: { type: string, minLength: 1, maxLength: 128 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned as `next_cursor` by the previous page.
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        The token is valid but not accepted here (code `forbidden`): a legacy-scoped token or a
        service account key used outside the operations that list its scope in `x-token-scopes`, or a
        key used on an operation that needs a session token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict with current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LegacyTrue:
      description: The request was accepted; the body is the text `true`.
      content:
        text/plain:
          schema: { type: string, enum: ["true"] }
    TooManyRequests:
      description: Rate limited (code `rate_limited`); retry after the `Retry-After` header (seconds).
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: Cloudflare rejected or failed the request (code `cloudflare_error`); `error.message` carries Cloudflare's reason.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: not_found }
            message: { type: string }

    Health:
      type: object
      required: [status, time, version]
      properties:
        status: { type: string, example: ok }
        time:
          type: string
          format: date-time
          description: Server clock; useful to diagnose agent clock_skew errors.
        version: { type: string }

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: { type: string }

    User:
      type: object
      required: [id, username]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }

    ServiceAccountKeyScope:
      type: string
      description: |
        `legacy`: only the three legacy operations (and rotating itself).
        `mcp`: device control and read-only monitoring for AI agents (the operations that list `mcp`
        in `x-token-scopes`), never configuration, DDNS or key management.
      enum: [legacy, mcp]

    ServiceAccountKey:
      type: object
      required: [id, name, scope, status, ttl_seconds, created_at, expires_at]
      properties:
        id: { type: string, format: uuid, description: Also the `kid` of the key's JWT header. }
        name: { type: string, minLength: 1, maxLength: 64 }
        scope: { $ref: "#/components/schemas/ServiceAccountKeyScope" }
        status:
          type: string
          description: |
            `active`, `rotated` (replaced by a rotation; dead once the grace window is over),
            `expired` or `revoked`.
          enum: [active, rotated, expired, revoked]
        ttl_seconds: { type: integer, description: Lifetime chosen at creation; a rotation reuses it. }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at:
          type: string
          format: date-time
          description: Last authenticated request, accurate to about a minute. Absent if never used.
        rotated_to:
          type: string
          format: uuid
          description: The key that replaced this one. Absent unless rotated.

    ServiceAccountKeyCreated:
      description: A key together with its secret. The secret is returned only by the operation that made the key.
      allOf:
        - $ref: "#/components/schemas/ServiceAccountKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: "The credential (a JWT signed by the key's private key). Send it as `Authorization: Bearer <key>`. Treat it as a password."
            previous_key_id:
              type: string
              format: uuid
              description: Rotation only; the key that was replaced.
            previous_key_valid_until:
              type: string
              format: date-time
              description: Rotation only; when the replaced key stops working.

    CreateServiceAccountKeyRequest:
      type: object
      required: [name, scope]
      properties:
        name: { type: string, minLength: 1, maxLength: 64, description: "What the key is for (for example `claude mcp`)." }
        scope: { $ref: "#/components/schemas/ServiceAccountKeyScope" }
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 630720000
          default: 31536000
          description: Lifetime in seconds. Default one year, at most 20 years.

    RotateServiceAccountKeyRequest:
      type: object
      properties:
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 630720000
          description: Lifetime of the new key in seconds. Default is the old key's `ttl_seconds`.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 256, format: password }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: Access token lifetime in seconds }

    DeviceStatus:
      type: string
      description: Observed reachability.
      enum: [unknown, online, offline]

    PowerTransition:
      type: string
      description: Derived from the device's active command.
      enum: [none, waking, shutting_down]

    AgentBinding:
      type: object
      required: [agent_id, port]
      properties:
        agent_id: { type: string, format: uuid }
        port: { type: integer, minimum: 1, maximum: 65535, default: 9750 }
        scheme: { type: string, enum: [http, https], default: http }
        status:
          type: string
          readOnly: true
          description: |
            Reachability of the agent as seen by the Controller: `ready` (the bound agent answered its
            last contact), `unreachable` (the last contact failed, the answering agent is not the bound
            one, or the device is offline) or `unknown` (not contacted yet, or the binding just
            changed). Updated by every shutdown request and by a health check about once a minute for
            devices seen online. Always present on a device's agent; clients should still treat absence
            as `unknown`.
          enum: [ready, unreachable, unknown]
        version: { type: string, readOnly: true, description: Agent version reported by its last successful health check; absent until then. }
        last_ok_at: { type: string, format: date-time, readOnly: true, description: Last successful contact with the agent (a health check or an accepted shutdown); absent until then. }

    DeviceType:
      type: string
      description: Kind of machine; used by clients for icons and labels only.
      enum: [desktop, server, laptop, tv, nas, iot, router]
      default: desktop

    OperatingSystem:
      type: string
      description: Operating system family; informational only.
      enum: [windows, linux, macos, android, freebsd, embedded]
      default: linux

    Device:
      type: object
      required:
        [id, name, ip_address, monitor_port, monitor_interval_seconds, monitor_timeout_ms,
         enabled, status, power_transition, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        hostname: { type: string, deprecated: true, x-deprecated-reason: "probes, agent requests and alerts use ip_address", description: "Deprecated and ignored: probes, agent requests and alerts always use `ip_address`. Kept for compatibility; will be removed." }
        ip_address: { type: string }
        mac_address: { type: string, example: "aa:bb:cc:dd:ee:ff" }
        wol_broadcast_address: { type: string }
        wol_port: { type: integer }
        device_type: { $ref: "#/components/schemas/DeviceType" }
        os: { $ref: "#/components/schemas/OperatingSystem" }
        monitor_port: { type: integer }
        monitor_interval_seconds: { type: integer }
        monitor_timeout_ms: { type: integer }
        enabled: { type: boolean }
        status: { $ref: "#/components/schemas/DeviceStatus" }
        power_transition: { $ref: "#/components/schemas/PowerTransition" }
        agent: { $ref: "#/components/schemas/AgentBinding" }
        last_seen_at: { type: string, format: date-time }
        last_checked_at: { type: string, format: date-time }
        last_latency_ms:
          type: integer
          description: Connect time of the most recent successful probe; absent until one succeeded.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DeviceCreate:
      type: object
      required: [name, ip_address, monitor_port]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        hostname: { type: string, maxLength: 253, deprecated: true, x-deprecated-reason: "probes, agent requests and alerts use ip_address", description: "Deprecated and ignored: probes, agent requests and alerts always use `ip_address`. Kept for compatibility; will be removed." }
        ip_address: { type: string, maxLength: 253 }
        mac_address: { type: string }
        wol_broadcast_address: { type: string }
        wol_port: { type: integer, minimum: 1, maximum: 65535, default: 9 }
        device_type: { $ref: "#/components/schemas/DeviceType" }
        os: { $ref: "#/components/schemas/OperatingSystem" }
        monitor_port: { type: integer, minimum: 1, maximum: 65535 }
        monitor_interval_seconds: { type: integer, minimum: 5, maximum: 3600, default: 30 }
        monitor_timeout_ms: { type: integer, minimum: 100, maximum: 10000, default: 2000 }
        enabled: { type: boolean, default: true }
        agent: { $ref: "#/components/schemas/AgentBinding" }

    DeviceUpdate:
      type: object
      description: |
        Partial update; omitted fields are unchanged. Send `""` to clear `description`, `hostname`,
        `mac_address` or `wol_broadcast_address`. Use `DELETE /devices/{id}/agent` to unbind the agent.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        hostname: { type: string, maxLength: 253, deprecated: true, x-deprecated-reason: "probes, agent requests and alerts use ip_address", description: "Deprecated and ignored: probes, agent requests and alerts always use `ip_address`. Kept for compatibility; will be removed." }
        ip_address: { type: string, maxLength: 253 }
        mac_address: { type: string }
        wol_broadcast_address: { type: string }
        wol_port: { type: integer, minimum: 1, maximum: 65535 }
        device_type: { $ref: "#/components/schemas/DeviceType" }
        os: { $ref: "#/components/schemas/OperatingSystem" }
        monitor_port: { type: integer, minimum: 1, maximum: 65535 }
        monitor_interval_seconds: { type: integer, minimum: 5, maximum: 3600 }
        monitor_timeout_ms: { type: integer, minimum: 100, maximum: 10000 }
        enabled: { type: boolean }
        agent: { $ref: "#/components/schemas/AgentBinding" }

    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Device" }
        next_cursor: { type: string }

    StatusChange:
      type: object
      required: [status, changed_at]
      properties:
        status: { $ref: "#/components/schemas/DeviceStatus" }
        previous_status: { $ref: "#/components/schemas/DeviceStatus" }
        changed_at: { type: string, format: date-time }
        reason: { type: string }

    StatusHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StatusChange" }
        next_cursor: { type: string }

    ProbeResult:
      type: object
      required: [device_id, reachable, status, checked_at]
      properties:
        device_id: { type: string, format: uuid }
        reachable: { type: boolean }
        latency_ms: { type: integer }
        status: { $ref: "#/components/schemas/DeviceStatus" }
        checked_at: { type: string, format: date-time }
        error: { type: string }

    CommandType:
      type: string
      enum: [wake, shutdown]

    CommandStatus:
      type: string
      enum: [pending, sent, acknowledged, completed, failed, timed_out]

    Command:
      type: object
      description: |
        Asynchronous wake or shutdown. Terminal statuses: `completed`, `failed`, `timed_out`.

        | status | wake | shutdown |
        |---|---|---|
        | `pending` | created | created |
        | `sent` | magic packet sent | signed request delivered to the agent's address |
        | `acknowledged` | not used | agent answered `202`/`200` |
        | `completed` | monitor saw the device online | monitor saw the device offline |
        | `failed` | packet could not be sent | dispatch failed or the agent rejected it (`error_code`) |
        | `timed_out` | `deadline_at` passed, device not seen online | `deadline_at` passed, device not seen offline |
      required: [id, device_id, type, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/CommandType" }
        status: { $ref: "#/components/schemas/CommandStatus" }
        requested_by: { type: string, format: uuid }
        error_code:
          type: string
          description: |
            Machine-readable failure reason, present when `status` is `failed`. Values returned by the
            agent (`unauthorized`, `bad_request`, `wrong_agent`, `action_not_allowed`, `clock_skew`,
            `stale`, `replay`, `busy`) are passed through. The Controller adds `wol_send_failed` (wake)
            and, for shutdown, `agent_unreachable`, `agent_timeout`, `agent_bad_response`,
            `agent_error` and `dispatch_error`; `interrupted` marks a command left pending by a
            restart. Clients must tolerate unknown values and fall back to `error`.
        error: { type: string, description: Human-readable failure text. }
        deadline_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CommandList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Command" }
        next_cursor: { type: string }

    SystemMetrics:
      type: object
      required: [collected_at, platform]
      properties:
        collected_at: { type: string, format: date-time }
        platform: { type: string, example: linux/arm64 }
        hostname: { type: string }
        uptime_seconds: { type: integer, format: int64 }
        cpu_percent: { type: number, format: double }
        memory:
          type: object
          properties:
            total_bytes: { type: integer, format: int64 }
            available_bytes: { type: integer, format: int64 }
            used_bytes: { type: integer, format: int64 }
        disk:
          type: object
          properties:
            path: { type: string }
            total_bytes: { type: integer, format: int64 }
            free_bytes: { type: integer, format: int64 }
            used_bytes: { type: integer, format: int64 }
        local_ips:
          type: array
          items: { type: string }
        local_addresses:
          type: array
          description: Local unicast addresses paired with their network interface names; local_ips remains available for older clients.
          items:
            type: object
            required: [interface_name, ip_address]
            properties:
              interface_name: { type: string }
              ip_address: { type: string }
        cpu_cores: { type: integer }
        load_average:
          type: array
          description: 1, 5 and 15 minute load averages; absent where the OS has none.
          items: { type: number, format: double }
          minItems: 3
          maxItems: 3
        kernel: { type: string, example: 5.15.0-1052-raspi }
        restricted:
          type: array
          description: Metric names the platform does not expose (for example on Android), so clients can explain why they are missing.
          items: { type: string, example: load_average }
        process:
          type: object
          properties:
            pid: { type: integer }
            uptime_seconds: { type: integer, format: int64 }
            rss_bytes: { type: integer, format: int64 }
            goroutines: { type: integer }
            heap_alloc_bytes: { type: integer, format: int64 }

    SystemInfo:
      type: object
      required: [version, mode]
      properties:
        version: { type: string }
        mode: { type: string, enum: [controller, agent, both] }
        listen: { type: string, example: ":8080" }
        tls: { type: boolean }
        api_docs:
          type: boolean
          description: Whether OpenAPI docs are enabled by the persisted system setting.
        access_token_ttl_seconds: { type: integer }
        refresh_token_ttl_seconds: { type: integer }
        retention_days: { type: integer }
        monitor_defaults:
          type: object
          properties:
            interval_seconds: { type: integer }
            timeout_ms: { type: integer }
            offline_threshold: { type: integer }
        command_deadlines:
          type: object
          properties:
            wake_seconds: { type: integer }
            shutdown_seconds: { type: integer }

    OpenAPISettings:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Enables GET /api/docs, /api/openapi.json and /api/swagger.json.

    ControllerKey:
      type: object
      required: [key_id, algorithm, public_key]
      properties:
        key_id: { type: string, example: 3f9a0c1d2b4e5f60 }
        algorithm: { type: string, enum: [ed25519] }
        public_key: { type: string, description: Standard base64 of the 32-byte public key }

    ActivityCategory:
      type: string
      description: |
        `auth` sign-in and sign-out; `device` device and agent-binding changes; `command` wake and
        shutdown requests; `ddns` DDNS changes; `user` account changes; `system` anything else
        (for example the creation of the controller key).
      enum: [auth, device, command, ddns, user, system]

    ActivityItem:
      type: object
      required: [id, at, category, action, result, message]
      properties:
        id: { type: integer, format: int64, description: Increasing entry id; stable. }
        at: { type: string, format: date-time }
        actor:
          type: string
          description: Username at the time of the action, `cli` for the command line, `system` for the Controller itself. Absent when unknown (a failed sign-in for an unknown name).
        category: { $ref: "#/components/schemas/ActivityCategory" }
        action:
          type: string
          description: "Machine-readable action, for example `device.shutdown`, `device.update`, `auth.login`. Clients must tolerate unknown values."
        device_id: { type: string, format: uuid, description: The device the entry is about (it may have been deleted since). }
        command_id: { type: string, format: uuid, description: Set on wake and shutdown requests. }
        result:
          type: string
          description: "`ok`, `failed`, or an error code."
        message: { type: string, description: Human-readable English summary. }

    ActivityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }
        next_cursor: { type: string }

    DnsRecordType:
      type: string
      enum: [A, AAAA]

    DdnsConfig:
      type: object
      required: [id, name, zone_id, record_id, record_name, record_type, proxied, ttl, interval_seconds, enabled, has_api_token, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        zone_id: { type: string }
        record_id: { type: string, description: "Cloudflare record id, chosen from the record lookup when the configuration was created." }
        record_name: { type: string, example: home.example.com }
        record_type: { $ref: "#/components/schemas/DnsRecordType" }
        proxied: { type: boolean }
        ttl: { type: integer, description: "1 = automatic" }
        interval_seconds: { type: integer }
        enabled: { type: boolean }
        has_api_token: { type: boolean, description: The token itself is never returned. }
        last_ip: { type: string, description: Address the Controller last pushed to Cloudflare. }
        detected_ip: { type: string, description: Public address found by the most recent discovery run. }
        dns_value: { type: string, description: Content of the Cloudflare record as last read. }
        last_checked_at: { type: string, format: date-time, description: "Last discovery/comparison run, whether or not it changed the record." }
        last_synced_at: { type: string, format: date-time }
        last_error: { type: string }
        last_error_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DdnsConfigCreate:
      type: object
      required: [name, zone_id, record_id, record_name, record_type, api_token]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        zone_id: { type: string, minLength: 1 }
        record_id: { type: string, minLength: 1, description: "Record picked with `listCloudflareRecords`. `record_name`, `record_type`, `proxied` and `ttl` are copied from that record by the client; the Controller does not look records up by name." }
        record_name: { type: string, minLength: 1, maxLength: 253 }
        record_type: { $ref: "#/components/schemas/DnsRecordType" }
        proxied: { type: boolean, default: false }
        ttl: { type: integer, minimum: 1, maximum: 86400, default: 1 }
        interval_seconds: { type: integer, minimum: 60, maximum: 86400, default: 300 }
        enabled: { type: boolean, default: true }
        api_token: { type: string, writeOnly: true, description: "Cloudflare API token scoped to Zone:DNS:Edit" }

    DdnsConfigUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        zone_id: { type: string, minLength: 1 }
        record_id: { type: string, minLength: 1, description: "Required together with `zone_id` and `record_name` when the target record changes; changing `zone_id` without `record_id` is `400`." }
        record_name: { type: string, minLength: 1, maxLength: 253 }
        record_type: { $ref: "#/components/schemas/DnsRecordType" }
        proxied: { type: boolean }
        ttl: { type: integer, minimum: 1, maximum: 86400 }
        interval_seconds: { type: integer, minimum: 60, maximum: 86400 }
        enabled: { type: boolean }
        api_token: { type: string, writeOnly: true }

    AlertEvent:
      type: string
      enum: [ip_changed, power_command, status_changed]
      description: |
        `ip_changed`: a DDNS record was moved to a new public IP address. `power_command`: a wake or
        shutdown request was accepted (any client: UI, legacy endpoints, MCP). `status_changed`: a
        monitored device went online or offline **without** a wake/shutdown command in progress,
        for example the machine lost power or was switched on by hand.

    AlertChannelType:
      type: string
      enum: [telegram]

    AlertChannel:
      type: object
      required: [id, name, type, enabled, events, settings, has_secret, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/AlertChannelType" }
        enabled: { type: boolean }
        events:
          type: array
          items: { $ref: "#/components/schemas/AlertEvent" }
        settings:
          type: object
          additionalProperties: { type: string }
          description: "Non-secret adapter settings (`telegram`: `target_user_id`)."
        has_secret: { type: boolean, description: The secret itself is never returned. }
        last_sent_at: { type: string, format: date-time, description: Last successful delivery (including tests). }
        last_error: { type: string, description: Reason of the last failed delivery; cleared by the next success. }
        last_error_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AlertChannelCreate:
      type: object
      required: [name, type, settings, secret]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { $ref: "#/components/schemas/AlertChannelType" }
        enabled: { type: boolean, default: true }
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/AlertEvent" }
          description: Defaults to every event.
        settings:
          type: object
          additionalProperties: { type: string }
        secret: { type: string, writeOnly: true, minLength: 1, maxLength: 512, description: "`telegram`: the bot token." }

    AlertChannelUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        enabled: { type: boolean }
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/AlertEvent" }
        settings:
          type: object
          additionalProperties: { type: string }
        secret: { type: string, writeOnly: true, minLength: 1, maxLength: 512 }

    AlertTestResult:
      type: object
      required: [channel_id, result, sent_at]
      properties:
        channel_id: { type: string, format: uuid }
        result: { type: string, enum: [sent, failed] }
        sent_at: { type: string, format: date-time }
        error: { type: string, description: Present when `result` is `failed`; never contains the secret. }

    PortForwardProtocol:
      type: string
      enum: [tcp, udp, universal]
      description: "`universal` listens for TCP **and** UDP on the same port."

    PortForwardStatus:
      type: string
      enum: [running, stopped, error]
      description: |
        What the Controller is doing now, not what is stored. `running`: listening. `stopped`: the
        rule is disabled (or the Controller has not started it yet). `error`: the rule is enabled but
        could not listen (reason in `last_error`); it is retried every 15 seconds.

    PortForward:
      type: object
      required: [id, name, protocol, listen_address, listen_port, target_host, target_port, enabled, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        protocol: { $ref: "#/components/schemas/PortForwardProtocol" }
        listen_address: { type: string, example: 0.0.0.0, description: "IP address of a local interface; `0.0.0.0` (or `::`) = all." }
        listen_port: { type: integer, minimum: 1, maximum: 65535 }
        target_host: { type: string, example: 192.168.1.20, description: "IP address or host name." }
        target_port: { type: integer, minimum: 1, maximum: 65535 }
        enabled: { type: boolean, description: "The stored on/off switch; restored after a restart." }
        status: { $ref: "#/components/schemas/PortForwardStatus" }
        last_error: { type: string, description: "Why the rule is in `error`; absent otherwise." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PortForwardCreate:
      type: object
      required: [name, protocol, listen_port, target_host, target_port]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: "Unique, ignoring case." }
        protocol: { $ref: "#/components/schemas/PortForwardProtocol" }
        listen_address: { type: string, default: 0.0.0.0 }
        listen_port: { type: integer, minimum: 1, maximum: 65535 }
        target_host: { type: string, minLength: 1, maxLength: 253 }
        target_port: { type: integer, minimum: 1, maximum: 65535 }
        enabled: { type: boolean, default: true }

    PortForwardUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        protocol: { $ref: "#/components/schemas/PortForwardProtocol" }
        listen_address: { type: string }
        listen_port: { type: integer, minimum: 1, maximum: 65535 }
        target_host: { type: string, minLength: 1, maxLength: 253 }
        target_port: { type: integer, minimum: 1, maximum: 65535 }
        enabled: { type: boolean }

    CloudflareLookup:
      type: object
      description: |
        Credentials for a Cloudflare lookup: give **exactly one** of `api_token` (a token the user is
        typing into the form, not yet saved) or `config_id` (reuse the sealed token of an existing
        DDNS configuration). Neither or both: `400`.
      properties:
        api_token: { type: string, writeOnly: true, format: password }
        config_id: { type: string, format: uuid }

    CloudflareZone:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string, example: example.com }

    CloudflareZoneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Zones the token can see, ordered by `name`.
          items: { $ref: "#/components/schemas/CloudflareZone" }

    CloudflareRecord:
      type: object
      required: [id, name, type, content, proxied, ttl]
      properties:
        id: { type: string }
        name: { type: string, example: home.example.com }
        type: { $ref: "#/components/schemas/DnsRecordType" }
        content: { type: string, description: Current value (an IP address). }
        proxied: { type: boolean }
        ttl: { type: integer, description: "1 = automatic" }

    CloudflareRecordList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: "`A` and `AAAA` records of the zone, ordered by `name`."
          items: { $ref: "#/components/schemas/CloudflareRecord" }

    DdnsSyncResult:
      type: object
      required: [config_id, result, synced_at]
      properties:
        config_id: { type: string, format: uuid }
        result: { type: string, enum: [updated, unchanged, failed] }
        ip: { type: string }
        error: { type: string }
        synced_at: { type: string, format: date-time }
