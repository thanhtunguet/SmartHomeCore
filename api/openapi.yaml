openapi: 3.0.3
info:
  title: HomeCore API
  version: 0.1.0
  description: |
    REST API of the HomeCore Controller.

    * All `/api/v1` endpoints require a Bearer JWT unless marked otherwise.
    * There are no roles: every authenticated user may call every operation (ADR-011).
    * Wake/shutdown return `202 Accepted` with a command; poll `GET /api/v1/commands/{id}` for the outcome.
    * Wake/shutdown are **idempotent** and **fail fast**: repeating one has the effect of sending it
      once and is never an error (see each operation). At most **one wake/shutdown request per device
      per second**, counted across all users; more answer `429 rate_limited` with `Retry-After: 1`.

    Conventions:

    * **Errors** always use the envelope `{"error":{"code","message"}}`, including `501 not_implemented`
      for operations the Controller has not implemented yet.
    * **Lists** are cursor-paginated (`limit`, `cursor`, `next_cursor`); there is no total count.
      Order is fixed per endpoint: devices by `name` (case-insensitive, ascending), commands newest
      first, status history newest first, activity newest first.
    * **Clearing optional text fields** on `PATCH /devices/{id}`: send an empty string (`""`) for
      `description`, `hostname`, `mac_address` or `wol_broadcast_address`. Omitted fields are unchanged.
      `null` is not used. To remove the agent binding call `DELETE /devices/{id}/agent`.
    * **Optional response fields** may be absent when the Controller cannot supply them (for example
      metrics a platform does not expose); clients must treat absence as "unknown".
  license:
    name: Proprietary
servers:
  - url: /
security:
  - bearerAuth: []

tags:
  - name: health
  - name: auth
  - name: devices
  - name: commands
  - name: system
  - name: activity
  - name: ddns

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: Readiness probe (database reachable, migrations applied)
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange username/password for tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Rotate a refresh token and get a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke a refresh token family
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: List devices
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [devices]
      operationId: createDevice
      summary: Register a device
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      tags: [devices]
      operationId: getDevice
      summary: Get a device
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [devices]
      operationId: updateDevice
      summary: Update a device (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [devices]
      operationId: deleteDevice
      summary: Delete a device
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/devices/{id}/agent:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    delete:
      tags: [devices]
      operationId: removeDeviceAgent
      summary: Remove the agent binding (remote shutdown no longer possible)
      description: Idempotent for a device that exists but has no binding (`204`).
      responses:
        "204": { description: Binding removed (or none existed) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/devices/{id}/wake:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    post:
      tags: [devices, commands]
      operationId: wakeDevice
      summary: Send Wake-on-LAN (asynchronous, idempotent)
      description: |
        Returns a `wake` command (`202`). Idempotent: if a wake command is already active for this
        device that command is returned, and if the device is already `online` the command completes
        immediately without sending a packet. Neither case is an error. A command of the other type
        (shutdown) is independent and does not affect this one.

        The command is `pending`, then `sent` once the magic packet left (a send failure is reported
        at once as `failed`); there is no `acknowledged` step. It becomes `completed` when the
        monitor sees the device online before `deadline_at` (default 180 s) and `timed_out`
        otherwise.

        `409 Conflict` only when the request cannot work at all: the device has no `mac_address`.
        `429` when this device already received a wake/shutdown request less than 1 s ago.
      responses:
        "202":
          description: Wake command accepted (not the same as "device powered on")
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/devices/{id}/shutdown:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    post:
      tags: [devices, commands]
      operationId: shutdownDevice
      summary: Request a signed shutdown via the device's agent (asynchronous, idempotent)
      description: |
        Returns a `shutdown` command (`202`). Idempotent: if a shutdown command is already active for
        this device that command is returned, and if the device is already `offline` the command
        completes immediately without contacting the agent. Neither case is an error. A command of
        the other type (wake) is independent and does not affect this one.

        Lifecycle: `pending` → `sent` (request signed and delivered) → `acknowledged` (the agent
        accepted it) → `completed` (the monitor saw the device go offline before `deadline_at`,
        default 120 s). `failed` when dispatch fails or the agent rejects the command (see
        `error_code` on `Command`); dispatch is one short attempt, so an unreachable agent fails
        within seconds. `timed_out` when the deadline passes first.

        `409 Conflict` only when the request cannot work at all: the device has no agent binding.
        `429` when this device already received a wake/shutdown request less than 1 s ago.
        Audited in `audit_log`.
      responses:
        "202":
          description: Shutdown command accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/devices/{id}/probe:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    post:
      tags: [devices]
      operationId: probeDevice
      summary: Run a TCP probe now
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/devices/{id}/history:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      tags: [devices]
      operationId: getDeviceHistory
      summary: Status transitions of a device
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: History
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusHistory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/commands:
    get:
      tags: [commands]
      operationId: listCommands
      summary: Command history
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: device_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CommandStatus" }
      responses:
        "200":
          description: Commands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/commands/{id}:
    get:
      tags: [commands]
      operationId: getCommand
      summary: Get a command
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Command
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/system/metrics:
    get:
      tags: [system]
      operationId: getSystemMetrics
      summary: Metrics of the host running the Controller
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemMetrics" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/system/info:
    get:
      tags: [system]
      operationId: getSystemInfo
      summary: Read-only Controller information and effective defaults
      description: Never contains secrets, keys or file paths.
      responses:
        "200":
          description: Controller information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/system/controller-key:
    get:
      tags: [system]
      operationId: getControllerKey
      summary: Public signing key to paste into an agent's trusted_controllers
      description: |
        The active Ed25519 key the Controller signs agent commands with. Only the public part is ever
        returned. `key_id` is the lower-case hex of the first 8 bytes of SHA-256(public key), the same
        value an agent logs when it trusts the key. The key is generated on the Controller's first start.
        The same values are printed by `homecore key show`.
      responses:
        "200":
          description: Active controller public key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControllerKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/activity:
    get:
      tags: [activity]
      operationId: listActivity
      summary: Activity feed (who did what), newest first
      description: |
        Read-only feed built from the Controller's audit log: sign-ins, device changes, wake and
        shutdown requests, account changes. Any authenticated user may read it (ADR-011).

        Command *outcomes* (`completed`, `timed_out`) are not entries here: an entry of category
        `command` carries the `command_id`, and `GET /commands/{id}` gives its lifecycle.
        Client addresses and the reasons of failed sign-ins are not exposed. Cursor-paginated like
        the other lists; entries are never pruned by `retention_days`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: device_id
          in: query
          description: Only entries about this device.
          schema: { type: string, format: uuid }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/ActivityCategory" }
      responses:
        "200":
          description: Activity entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/ddns:
    get:
      tags: [ddns]
      operationId: listDdnsConfigs
      summary: List DDNS configurations
      responses:
        "200":
          description: DDNS configs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DdnsConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ddns]
      operationId: createDdnsConfig
      summary: Add a DDNS configuration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DdnsConfigCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DdnsConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/ddns/cloudflare/zones:
    post:
      tags: [ddns]
      operationId: listCloudflareZones
      summary: List the Cloudflare zones a token can see
      description: |
        Feeds the zone dropdown of the DDNS form, which is the only way to pick a zone: a token that
        may edit DNS can also read it, so nothing is typed by hand. It is a `POST` only so that the
        token travels in the body (never in a URL or an access log); it changes nothing. The token
        is not stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudflareLookup" }
      responses:
        "200":
          description: Zones
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudflareZoneList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/ddns/cloudflare/zones/{zone_id}/records:
    parameters:
      - name: zone_id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      tags: [ddns]
      operationId: listCloudflareRecords
      summary: List the A/AAAA records of a Cloudflare zone
      description: |
        Feeds the record dropdown of the DDNS form (same body and reasons as `listCloudflareZones`).
        `404` when `config_id` is unknown.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudflareLookup" }
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudflareRecordList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/ddns/{id}:
    parameters:
      - $ref: "#/components/parameters/DdnsId"
    patch:
      tags: [ddns]
      operationId: updateDdnsConfig
      summary: Update a DDNS configuration (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DdnsConfigUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DdnsConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [ddns]
      operationId: deleteDdnsConfig
      summary: Delete a DDNS configuration
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/ddns/{id}/sync:
    parameters:
      - $ref: "#/components/parameters/DdnsId"
    post:
      tags: [ddns]
      operationId: syncDdnsConfig
      summary: Synchronise one DDNS record now
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DdnsSyncResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DeviceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DdnsId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned as `next_cursor` by the previous page.
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict with current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited (code `rate_limited`); retry after the `Retry-After` header (seconds).
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: Cloudflare rejected or failed the request (code `cloudflare_error`); `error.message` carries Cloudflare's reason.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: not_found }
            message: { type: string }

    Health:
      type: object
      required: [status, time, version]
      properties:
        status: { type: string, example: ok }
        time:
          type: string
          format: date-time
          description: Server clock; useful to diagnose agent clock_skew errors.
        version: { type: string }

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: { type: string }

    User:
      type: object
      required: [id, username]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 256, format: password }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: Access token lifetime in seconds }

    DeviceStatus:
      type: string
      description: Observed reachability.
      enum: [unknown, online, offline]

    PowerTransition:
      type: string
      description: Derived from the device's active command.
      enum: [none, waking, shutting_down]

    AgentBinding:
      type: object
      required: [agent_id, port]
      properties:
        agent_id: { type: string, format: uuid }
        port: { type: integer, minimum: 1, maximum: 65535, default: 9750 }
        scheme: { type: string, enum: [http, https], default: http }
        status:
          type: string
          readOnly: true
          description: |
            Reachability of the agent as seen by the Controller: `ready` (the bound agent answered its
            last contact), `unreachable` (the last contact failed, the answering agent is not the bound
            one, or the device is offline) or `unknown` (not contacted yet, or the binding just
            changed). Updated by every shutdown request and by a health check about once a minute for
            devices seen online. Always present on a device's agent; clients should still treat absence
            as `unknown`.
          enum: [ready, unreachable, unknown]
        version: { type: string, readOnly: true, description: Agent version reported by its last successful health check; absent until then. }
        last_ok_at: { type: string, format: date-time, readOnly: true, description: Last successful contact with the agent (a health check or an accepted shutdown); absent until then. }

    DeviceType:
      type: string
      description: Kind of machine; used by clients for icons and labels only.
      enum: [desktop, server, laptop, tv, nas, iot, router]
      default: desktop

    OperatingSystem:
      type: string
      description: Operating system family; informational only.
      enum: [windows, linux, macos, android, freebsd, embedded]
      default: linux

    Device:
      type: object
      required:
        [id, name, ip_address, monitor_port, monitor_interval_seconds, monitor_timeout_ms,
         enabled, status, power_transition, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        hostname: { type: string }
        ip_address: { type: string }
        mac_address: { type: string, example: "aa:bb:cc:dd:ee:ff" }
        wol_broadcast_address: { type: string }
        wol_port: { type: integer }
        device_type: { $ref: "#/components/schemas/DeviceType" }
        os: { $ref: "#/components/schemas/OperatingSystem" }
        monitor_port: { type: integer }
        monitor_interval_seconds: { type: integer }
        monitor_timeout_ms: { type: integer }
        enabled: { type: boolean }
        status: { $ref: "#/components/schemas/DeviceStatus" }
        power_transition: { $ref: "#/components/schemas/PowerTransition" }
        agent: { $ref: "#/components/schemas/AgentBinding" }
        last_seen_at: { type: string, format: date-time }
        last_checked_at: { type: string, format: date-time }
        last_latency_ms:
          type: integer
          description: Connect time of the most recent successful probe; absent until one succeeded.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DeviceCreate:
      type: object
      required: [name, ip_address, monitor_port]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        hostname: { type: string, maxLength: 253 }
        ip_address: { type: string, maxLength: 253 }
        mac_address: { type: string }
        wol_broadcast_address: { type: string }
        wol_port: { type: integer, minimum: 1, maximum: 65535, default: 9 }
        device_type: { $ref: "#/components/schemas/DeviceType" }
        os: { $ref: "#/components/schemas/OperatingSystem" }
        monitor_port: { type: integer, minimum: 1, maximum: 65535 }
        monitor_interval_seconds: { type: integer, minimum: 5, maximum: 3600, default: 30 }
        monitor_timeout_ms: { type: integer, minimum: 100, maximum: 10000, default: 2000 }
        enabled: { type: boolean, default: true }
        agent: { $ref: "#/components/schemas/AgentBinding" }

    DeviceUpdate:
      type: object
      description: |
        Partial update; omitted fields are unchanged. Send `""` to clear `description`, `hostname`,
        `mac_address` or `wol_broadcast_address`. Use `DELETE /devices/{id}/agent` to unbind the agent.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        hostname: { type: string, maxLength: 253 }
        ip_address: { type: string, maxLength: 253 }
        mac_address: { type: string }
        wol_broadcast_address: { type: string }
        wol_port: { type: integer, minimum: 1, maximum: 65535 }
        device_type: { $ref: "#/components/schemas/DeviceType" }
        os: { $ref: "#/components/schemas/OperatingSystem" }
        monitor_port: { type: integer, minimum: 1, maximum: 65535 }
        monitor_interval_seconds: { type: integer, minimum: 5, maximum: 3600 }
        monitor_timeout_ms: { type: integer, minimum: 100, maximum: 10000 }
        enabled: { type: boolean }
        agent: { $ref: "#/components/schemas/AgentBinding" }

    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Device" }
        next_cursor: { type: string }

    StatusChange:
      type: object
      required: [status, changed_at]
      properties:
        status: { $ref: "#/components/schemas/DeviceStatus" }
        previous_status: { $ref: "#/components/schemas/DeviceStatus" }
        changed_at: { type: string, format: date-time }
        reason: { type: string }

    StatusHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StatusChange" }
        next_cursor: { type: string }

    ProbeResult:
      type: object
      required: [device_id, reachable, status, checked_at]
      properties:
        device_id: { type: string, format: uuid }
        reachable: { type: boolean }
        latency_ms: { type: integer }
        status: { $ref: "#/components/schemas/DeviceStatus" }
        checked_at: { type: string, format: date-time }
        error: { type: string }

    CommandType:
      type: string
      enum: [wake, shutdown]

    CommandStatus:
      type: string
      enum: [pending, sent, acknowledged, completed, failed, timed_out]

    Command:
      type: object
      description: |
        Asynchronous wake or shutdown. Terminal statuses: `completed`, `failed`, `timed_out`.

        | status | wake | shutdown |
        |---|---|---|
        | `pending` | created | created |
        | `sent` | magic packet sent | signed request delivered to the agent's address |
        | `acknowledged` | not used | agent answered `202`/`200` |
        | `completed` | monitor saw the device online | monitor saw the device offline |
        | `failed` | packet could not be sent | dispatch failed or the agent rejected it (`error_code`) |
        | `timed_out` | `deadline_at` passed, device not seen online | `deadline_at` passed, device not seen offline |
      required: [id, device_id, type, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/CommandType" }
        status: { $ref: "#/components/schemas/CommandStatus" }
        requested_by: { type: string, format: uuid }
        error_code:
          type: string
          description: |
            Machine-readable failure reason, present when `status` is `failed`. Values returned by the
            agent (`unauthorized`, `bad_request`, `wrong_agent`, `action_not_allowed`, `clock_skew`,
            `stale`, `replay`, `busy`) are passed through. The Controller adds `wol_send_failed` (wake)
            and, for shutdown, `agent_unreachable`, `agent_timeout`, `agent_bad_response`,
            `agent_error` and `dispatch_error`; `interrupted` marks a command left pending by a
            restart. Clients must tolerate unknown values and fall back to `error`.
        error: { type: string, description: Human-readable failure text. }
        deadline_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CommandList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Command" }
        next_cursor: { type: string }

    SystemMetrics:
      type: object
      required: [collected_at, platform]
      properties:
        collected_at: { type: string, format: date-time }
        platform: { type: string, example: linux/arm64 }
        hostname: { type: string }
        uptime_seconds: { type: integer, format: int64 }
        cpu_percent: { type: number, format: double }
        memory:
          type: object
          properties:
            total_bytes: { type: integer, format: int64 }
            available_bytes: { type: integer, format: int64 }
            used_bytes: { type: integer, format: int64 }
        disk:
          type: object
          properties:
            path: { type: string }
            total_bytes: { type: integer, format: int64 }
            free_bytes: { type: integer, format: int64 }
            used_bytes: { type: integer, format: int64 }
        local_ips:
          type: array
          items: { type: string }
        local_addresses:
          type: array
          description: Local unicast addresses paired with their network interface names; local_ips remains available for older clients.
          items:
            type: object
            required: [interface_name, ip_address]
            properties:
              interface_name: { type: string }
              ip_address: { type: string }
        cpu_cores: { type: integer }
        load_average:
          type: array
          description: 1, 5 and 15 minute load averages; absent where the OS has none.
          items: { type: number, format: double }
          minItems: 3
          maxItems: 3
        kernel: { type: string, example: 5.15.0-1052-raspi }
        restricted:
          type: array
          description: Metric names the platform does not expose (for example on Android), so clients can explain why they are missing.
          items: { type: string, example: load_average }
        process:
          type: object
          properties:
            pid: { type: integer }
            uptime_seconds: { type: integer, format: int64 }
            rss_bytes: { type: integer, format: int64 }
            goroutines: { type: integer }
            heap_alloc_bytes: { type: integer, format: int64 }

    SystemInfo:
      type: object
      required: [version, mode]
      properties:
        version: { type: string }
        mode: { type: string, enum: [controller, agent, both] }
        listen: { type: string, example: ":8080" }
        tls: { type: boolean }
        api_docs: { type: boolean }
        access_token_ttl_seconds: { type: integer }
        refresh_token_ttl_seconds: { type: integer }
        retention_days: { type: integer }
        monitor_defaults:
          type: object
          properties:
            interval_seconds: { type: integer }
            timeout_ms: { type: integer }
            offline_threshold: { type: integer }
        command_deadlines:
          type: object
          properties:
            wake_seconds: { type: integer }
            shutdown_seconds: { type: integer }

    ControllerKey:
      type: object
      required: [key_id, algorithm, public_key]
      properties:
        key_id: { type: string, example: 3f9a0c1d2b4e5f60 }
        algorithm: { type: string, enum: [ed25519] }
        public_key: { type: string, description: Standard base64 of the 32-byte public key }

    ActivityCategory:
      type: string
      description: |
        `auth` sign-in and sign-out; `device` device and agent-binding changes; `command` wake and
        shutdown requests; `ddns` DDNS changes; `user` account changes; `system` anything else
        (for example the creation of the controller key).
      enum: [auth, device, command, ddns, user, system]

    ActivityItem:
      type: object
      required: [id, at, category, action, result, message]
      properties:
        id: { type: integer, format: int64, description: Increasing entry id; stable. }
        at: { type: string, format: date-time }
        actor:
          type: string
          description: Username at the time of the action, `cli` for the command line, `system` for the Controller itself. Absent when unknown (a failed sign-in for an unknown name).
        category: { $ref: "#/components/schemas/ActivityCategory" }
        action:
          type: string
          description: "Machine-readable action, for example `device.shutdown`, `device.update`, `auth.login`. Clients must tolerate unknown values."
        device_id: { type: string, format: uuid, description: The device the entry is about (it may have been deleted since). }
        command_id: { type: string, format: uuid, description: Set on wake and shutdown requests. }
        result:
          type: string
          description: "`ok`, `failed`, or an error code."
        message: { type: string, description: Human-readable English summary. }

    ActivityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }
        next_cursor: { type: string }

    DnsRecordType:
      type: string
      enum: [A, AAAA]

    DdnsConfig:
      type: object
      required: [id, name, zone_id, record_id, record_name, record_type, proxied, ttl, interval_seconds, enabled, has_api_token, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        zone_id: { type: string }
        record_id: { type: string, description: "Cloudflare record id, chosen from the record lookup when the configuration was created." }
        record_name: { type: string, example: home.example.com }
        record_type: { $ref: "#/components/schemas/DnsRecordType" }
        proxied: { type: boolean }
        ttl: { type: integer, description: "1 = automatic" }
        interval_seconds: { type: integer }
        enabled: { type: boolean }
        has_api_token: { type: boolean, description: The token itself is never returned. }
        last_ip: { type: string, description: Address the Controller last pushed to Cloudflare. }
        detected_ip: { type: string, description: Public address found by the most recent discovery run. }
        dns_value: { type: string, description: Content of the Cloudflare record as last read. }
        last_checked_at: { type: string, format: date-time, description: "Last discovery/comparison run, whether or not it changed the record." }
        last_synced_at: { type: string, format: date-time }
        last_error: { type: string }
        last_error_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DdnsConfigCreate:
      type: object
      required: [name, zone_id, record_id, record_name, record_type, api_token]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        zone_id: { type: string, minLength: 1 }
        record_id: { type: string, minLength: 1, description: "Record picked with `listCloudflareRecords`. `record_name`, `record_type`, `proxied` and `ttl` are copied from that record by the client; the Controller does not look records up by name." }
        record_name: { type: string, minLength: 1, maxLength: 253 }
        record_type: { $ref: "#/components/schemas/DnsRecordType" }
        proxied: { type: boolean, default: false }
        ttl: { type: integer, minimum: 1, maximum: 86400, default: 1 }
        interval_seconds: { type: integer, minimum: 60, maximum: 86400, default: 300 }
        enabled: { type: boolean, default: true }
        api_token: { type: string, writeOnly: true, description: "Cloudflare API token scoped to Zone:DNS:Edit" }

    DdnsConfigUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        zone_id: { type: string, minLength: 1 }
        record_id: { type: string, minLength: 1, description: "Required together with `zone_id` and `record_name` when the target record changes; changing `zone_id` without `record_id` is `400`." }
        record_name: { type: string, minLength: 1, maxLength: 253 }
        record_type: { $ref: "#/components/schemas/DnsRecordType" }
        proxied: { type: boolean }
        ttl: { type: integer, minimum: 1, maximum: 86400 }
        interval_seconds: { type: integer, minimum: 60, maximum: 86400 }
        enabled: { type: boolean }
        api_token: { type: string, writeOnly: true }

    CloudflareLookup:
      type: object
      description: |
        Credentials for a Cloudflare lookup: give **exactly one** of `api_token` (a token the user is
        typing into the form, not yet saved) or `config_id` (reuse the sealed token of an existing
        DDNS configuration). Neither or both: `400`.
      properties:
        api_token: { type: string, writeOnly: true, format: password }
        config_id: { type: string, format: uuid }

    CloudflareZone:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string, example: example.com }

    CloudflareZoneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Zones the token can see, ordered by `name`.
          items: { $ref: "#/components/schemas/CloudflareZone" }

    CloudflareRecord:
      type: object
      required: [id, name, type, content, proxied, ttl]
      properties:
        id: { type: string }
        name: { type: string, example: home.example.com }
        type: { $ref: "#/components/schemas/DnsRecordType" }
        content: { type: string, description: Current value (an IP address). }
        proxied: { type: boolean }
        ttl: { type: integer, description: "1 = automatic" }

    CloudflareRecordList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: "`A` and `AAAA` records of the zone, ordered by `name`."
          items: { $ref: "#/components/schemas/CloudflareRecord" }

    DdnsSyncResult:
      type: object
      required: [config_id, result, synced_at]
      properties:
        config_id: { type: string, format: uuid }
        result: { type: string, enum: [updated, unchanged, failed] }
        ip: { type: string }
        error: { type: string }
        synced_at: { type: string, format: date-time }
