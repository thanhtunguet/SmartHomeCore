# HomeCore configuration (all keys optional; values shown are defaults unless noted).
# Precedence: CLI flags > HOMECORE_* environment variables > this file > built-in defaults.
# Unknown keys are rejected to catch typos.

mode: controller            # controller | agent | both
data_dir: /var/lib/homecore # SQLite DB, master.key, agent identity
shutdown_timeout: 10s

log:
  level: info               # debug | info | warn | error
  format: json              # text | json

controller:
  listen: ":8080"
  tls:                      # optional; strongly recommended if the API is reachable beyond the LAN
    cert_file: ""
    key_file: ""
  api_docs: true            # serve /api/openapi.json and /api/docs (Swagger UI, offline)
  trusted_proxies: []       # CIDRs of reverse proxies whose X-Forwarded-For is trusted, e.g. ["127.0.0.1/32"]
  cors_allowed_origins: []  # exact origins; empty = same-origin only
  auth:                     # accounts are created with `homecore user add <username>` (no default account)
    access_token_ttl: 15m
    refresh_token_ttl: 720h
    login_rate_per_minute: 10
    api_rate_per_minute: 600
  monitor:
    tick: 5s
    default_interval: 30s
    default_timeout: 2s
    concurrency: 8
    offline_threshold: 2    # consecutive failed probes before a device is marked offline
  commands:
    wake_deadline: 180s
    shutdown_deadline: 120s
  retention_days: 30
  ddns:                     # Cloudflare DDNS (docs/requirements/ddns.md); the defaults are fine for most setups
    # Public-IP discovery asks these providers for the address they see this Controller connecting from,
    # so every one of them learns your public IP; that is inherent to asking "what is my IP". At least
    # two, on different hosts, https only. They must AGREE (two matching answers, no tie) before any DNS
    # record is touched. A list here REPLACES the built-in one. Do not put credentials or API keys in the
    # URLs unless you accept that they live in this file; they are never logged or returned.
    ip_providers:
      - https://api64.ipify.org
      - https://icanhazip.com
      - https://ifconfig.me/ip
      - https://checkip.amazonaws.com
    cloudflare_api_url: https://api.cloudflare.com/client/v4
    allow_insecure_http: false  # tests and development only: accepts http:// providers and Cloudflare URL

agent:
  # The Agent can run without this file: copy the command shown in the web UI (device > Remote Shutdown),
  # which passes --agent-id, --trusted-controller and --agent-listen as arguments. Run
  # `homecore --mode agent` in a terminal with nothing else and it asks for that command and writes the
  # systemd unit (Linux) or the shortcut (Windows).
  id: ""                    # agent_id (UUID) from the UI; env HOMECORE_AGENT_ID, flag --agent-id. Set: nothing is stored on disk
  listen: ":9750"           # LAN only. Never port-forward; use a VPN for remote access.
  data_dir: ""              # default: <data_dir>/agent. Holds agent_id only when id is empty
  tls:
    cert_file: ""
    key_file: ""
  allowed_actions: [shutdown]   # shutdown | reboot
  clock_skew: 30s
  action_delay: 3s          # reply first, act after this delay
  cooldown: 60s             # ignore further power actions after one is accepted
  dry_run: false            # log instead of acting (development)
  trusted_controllers: []   # public keys allowed to send commands, e.g.:
  #  - name: livingroom-tvbox
  #    public_key: "base64-ed25519-public-key"   # from GET /api/v1/system/controller-key
